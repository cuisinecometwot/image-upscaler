[package]
name = "upscaler-gui"
version = "0.1.0"
edition = "2021"
description = "Windows GUI for the Real-ESRGAN upscaler"

[lib]
name = "upscaler_gui_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
upscaler-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
